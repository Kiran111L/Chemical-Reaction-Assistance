<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chem-fig AI Chat</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- SIDEBAR OVERLAY (mobile) -->
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" class="logo-icon"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>
        <span>Chem-fig</span>
      </div>
      <button class="icon-btn" id="collapse-btn" onclick="toggleSidebar()" title="Collapse sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
      </button>
    </div>

    <button class="new-chat-btn" onclick="createNewChat()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>

    <div class="sidebar-section-label">Recents</div>
    <div class="chat-list" id="chat-list"></div>

    <div class="sidebar-footer">
      <div class="avatar">K</div>
      <div class="user-info">
        <div class="user-name">kiranlav</div>
        <div class="user-plan">Free plan</div>
      </div>
      <button class="icon-btn" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="main">

    <!-- TOPBAR -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="menu-btn" onclick="toggleSidebar()" title="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="model-dropdown" id="model-dropdown">
          <button class="model-btn" onclick="toggleModelMenu()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="color:var(--accent)"><circle cx="12" cy="12" r="10"/></svg>
            <span id="selected-model">Chem-fig</span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="model-menu" id="model-menu">
            <div class="model-option" onclick="selectModel('Chem-fig')">
              <div class="model-name">Chem-fig</div>
              <div class="model-desc">Advanced chemistry-aware model</div>
            </div>
          </div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" title="Share">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
        </button>
      </div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chat-area">
      <!-- Welcome or messages injected here by JS -->
    </div>

    <!-- ATTACHMENT PREVIEWS -->
    <div class="attachment-preview-bar" id="attachment-preview-bar"></div>

    <!-- INPUT AREA -->
    <div class="input-area">
      <div class="input-wrapper" id="input-wrapper">
        <div class="input-top">
          <textarea id="message-input" placeholder="Message Chem-fig..." rows="1"
            oninput="autoResize(this); updateSendBtn()"
            onkeydown="handleKey(event)"></textarea>
        </div>
        <div class="input-bottom">
          <div class="input-actions">
            <input type="file" id="file-input" accept="image/*" multiple style="display:none" onchange="handleFileSelect(event)"/>
            <button class="attach-btn" onclick="document.getElementById('file-input').click()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              Attach
            </button>
          </div>
          <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
      <div class="footer-note">Chem-fig can make mistakes. Please double-check responses.</div>
    </div>
  </main>

  <!-- RENAME MODAL -->
  <div class="modal-bg" id="rename-modal" onclick="closeRenameModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title">Rename chat</div>
      <input type="text" id="rename-input" class="modal-input" placeholder="Enter new name..." />
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeRenameModal()">Cancel</button>
        <button class="modal-btn confirm" onclick="confirmRename()">Rename</button>
      </div>
    </div>
  </div>

  <!-- CONTEXT MENU -->
  <div class="context-menu" id="context-menu">
    <div class="ctx-item" onclick="renameFromCtx()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
      Rename
    </div>
    <div class="ctx-item danger" onclick="deleteFromCtx()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      Delete
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
